name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Compile Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Node.js
        run: |
          node --version
          npm --version

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Verify Web Assets
        run: |
          echo "Checking dist directory..."
          ls -la dist
          test -f dist/index.html
          echo "Web application built successfully."

      - name: Initialize Capacitor Android Platform
        run: |
          npx cap add android
          npx cap sync android

      - name: Inject AdMob App ID into AndroidManifest.xml
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          META_TAG='<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"/>'
          sed -i "/<\/application>/i $META_TAG" "$MANIFEST"

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK
        run: |
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Output APK
        uses: actions/upload-artifact@v4
        with:
          name: Free-PDF-Editor-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
